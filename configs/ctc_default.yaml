# Configuration for URSM-CTC (CTC/HMM-based 1D alignment)

# Model configuration
model:
  max_disparity: 192
  feature_channels: 32
  hidden_dim: 128  # LSTM hidden dimension
  blank_threshold: 0.3  # Threshold for blank token (occlusion)
  use_error_correction: true  # Enable sparse parity check correction
  correction_iterations: 5  # Number of belief propagation iterations

# Data configuration
data:
  train_dir: "data/train"
  val_dir: "data/val"
  test_dir: "data/test"
  dataset_type: "custom"  # Options: 'custom', 'sceneflow', 'kitti', 'middlebury'

# Data augmentation
augmentation:
  # Simulate calibration errors (still useful for robustness)
  vertical_offset_range: [-10, 10]  # Pixels
  rotation_range: [-2, 2]  # Degrees
  scale_range: [0.95, 1.05]
  photometric: true

# Training configuration
training:
  num_epochs: 100
  batch_size: 4
  val_batch_size: 1
  num_workers: 8
  learning_rate: 0.0001
  weight_decay: 0.0001
  lr_milestones: [50, 70, 90]
  lr_gamma: 0.5
  log_interval: 10
  checkpoint_interval: 5

# Loss configuration
loss:
  ctc_weight: 1.0  # Weight for CTC alignment loss
  smooth_weight: 0.1  # Weight for smoothness loss
  occlusion_weight: 0.05  # Weight for occlusion consistency

# CTC-specific settings
ctc:
  beam_width: 10  # Beam width for decoding (not used in greedy)
  max_sequence_length: 2048  # Maximum sequence length for CTC

# Parity check error correction settings
error_correction:
  check_density: 0.1  # Density of parity check matrix (sparse)
  num_iterations: 5  # Belief propagation iterations
  smoothness_weight: 1.0  # Weight for smoothness constraint
  
# Evaluation
evaluation:
  metrics:
    - epe
    - bad_1
    - bad_2
    - bad_3
    - occlusion_accuracy
