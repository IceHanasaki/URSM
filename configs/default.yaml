# Default configuration for URSM training

# Model configuration
model:
  max_disparity: 192
  feature_channels: 32
  refine_iterations: 3
  estimate_calibration: true

# Data configuration
data:
  train_dir: "data/train"
  val_dir: "data/val"
  test_dir: "data/test"
  dataset_type: "custom"  # Options: 'custom', 'sceneflow', 'kitti', 'middlebury'

# Data augmentation
augmentation:
  vertical_offset_range: [-10, 10]  # Pixels
  rotation_range: [-2, 2]  # Degrees
  scale_range: [0.95, 1.05]
  photometric: true

# Training configuration
training:
  num_epochs: 100
  batch_size: 4
  val_batch_size: 1
  num_workers: 8
  learning_rate: 0.0001
  weight_decay: 0.0001
  lr_milestones: [50, 70, 90]
  lr_gamma: 0.5
  log_interval: 10
  checkpoint_interval: 5

# Loss configuration
loss:
  disparity_loss_type: "smooth_l1"  # Options: 'l1', 'smooth_l1', 'l2'
  uncertainty_weight: true
  smoothness_alpha: 0.1
  edge_aware: true

# Evaluation
evaluation:
  metrics:
    - epe
    - bad_1
    - bad_2
    - bad_3
    - d1_error
